# Meson cross file for the TV, using zig as the cross toolchain.
#
# `-mfloat-abi=softfp` is the point: the device is base-ABI (float arguments in
# core registers, `/lib/ld-linux.so.3`) but has a real FPU, and clang can spell
# that combination even though the Zig target triple cannot -- see docs/device.md.
# glibc 2.31 against the TV's 2.35 keeps the result forward-compatible.
#
#   meson setup build --cross-file ../tools/webos-cross.ini
#
# The compiler is the easy half. Anything built this way still needs headers
# and link-time .so files for its dependencies; see docs/device.md.
[binaries]
c = ['zig', 'cc', '-target', 'arm-linux-gnueabi.2.31', '-mcpu=cortex_a55', '-mfloat-abi=softfp']
cpp = ['zig', 'c++', '-target', 'arm-linux-gnueabi.2.31', '-mcpu=cortex_a55', '-mfloat-abi=softfp']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
strip = ['llvm-strip']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7a'
endian = 'little'
